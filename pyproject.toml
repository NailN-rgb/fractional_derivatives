[build-system]
requires=["hatchling"]
build-backend="hatchling.build"

[project]
name="fractional-derivatives"
version="0.1.0"
requires-python=">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]